    @keyframes blob1 {
      0%,100% { transform: translate(0px, 0px) scale(1); }
      33%      { transform: translate(60px, -40px) scale(1.15); }
      66%      { transform: translate(-30px, 50px) scale(0.9); }
    }
    @keyframes blob2 {
      0%,100% { transform: translate(0px, 0px) scale(1); }
      33%      { transform: translate(-70px, 30px) scale(1.1); }
      66%      { transform: translate(40px, -60px) scale(1.2); }

      0%,100% { transform: translate(0px, 0px) scale(1); }
      33%      { transform: translate(50px, 60px) scale(0.85); }
      66%      { transform: translate(-60px, -20px) scale(1.1); }
    }
    @keyframes blob4 {
      0%,100% { transform: translate(0px, 0px) scale(1); }
      50%      { transform: translate(-40px, 40px) scale(1.2); }
    }
    @keyframes shimmer {
      0%   { transform: translateX(-150%) rotate(25deg); }
      100% { transform: translateX(300%) rotate(25deg); }
    }
    html, body {
      min-height: 100%;
      margin: 0; padding: 0;
      max-width: 100vw;
      overflow-x: clip;

      position: relative;
      overflow-x: hidden;
      width: 100%;
      box-sizing: border-box;
    }
    *, *::before, *::after {
      box-sizing: border-box;
      max-width: 100%;
    }
    /* Blob canvas — scrolls WITH the page so new blobs appear as you scroll */
    #bg {
      position: absolute;
      top: 0; left: 0; right: 0;
      width: 100%;
      min-height: 400vh;
      z-index: 0;
      pointer-events: none;
      filter: blur(100px) saturate(1.2);
      overflow: hidden;
    }
    #bg .b {
      position: absolute;
      border-radius: 50%;
      opacity: 0.55;
    }

    #bg .b1  { width:90vw;  height:90vw;  top:-5%;   left:-25%;  background:#2563eb; animation: blob1 22s ease-in-out infinite; }
    #bg .b2  { width:70vw;  height:70vw;  top:0%;    right:-20%; background:#7c3aed; animation: blob2 18s ease-in-out infinite; }
    #bg .b3  { width:50vw;  height:50vw;  top:15%;   left:35%;   background:#3b82f6; opacity:0.45; animation: blob3 25s ease-in-out infinite; }
    /* --- MID ZONE --- */

    #bg .b5  { width:60vw;  height:60vw;  top:40%;   right:-15%; background:#8b5cf6; animation: blob1 28s ease-in-out infinite reverse; }
    #bg .b6  { width:45vw;  height:45vw;  top:50%;   left:25%;   background:#1d4ed8; opacity:0.45; animation: blob2 24s ease-in-out infinite reverse; }
    /* --- LOWER ZONE --- */
    #bg .b7  { width:85vw;  height:85vw;  top:62%;   right:-25%; background:#6d28d9; animation: blob3 22s ease-in-out infinite; }
    #bg .b8  { width:60vw;  height:60vw;  top:74%;   left:-10%;  background:#2563eb; opacity:0.5; animation: blob4 19s ease-in-out infinite; }
    #bg .b9  { width:45vw;  height:45vw;  top:84%;   left:45%;   background:#a855f7; opacity:0.35; animation: blob1 26s ease-in-out infinite reverse; }
    /* --- BOTTOM ZONE --- */
    #bg .b10 { width:85vw;  height:85vw;  top:93%;   left:-20%;  background:#0284c7; animation: blob2 21s ease-in-out infinite; }
    #bg .b11 { width:55vw;  height:55vw;  top:106%;  right:-15%; background:#4f46e5; animation: blob3 23s ease-in-out infinite reverse; }
    #bg .b12 { width:65vw;  height:65vw;  top:118%;  left:15%;   background:#7c3aed; opacity:0.45; animation: blob4 20s ease-in-out infinite; }

    #root { position: relative; z-index: 1; width: 100%; overflow-x: hidden; }

    /* Glassmorphism — alle kort og felter */
    .glass {
      background: rgba(255,255,255,0.08) !important;
      backdrop-filter: blur(16px) saturate(1.6) !important;
      -webkit-backdrop-filter: blur(16px) saturate(1.6) !important;

    @keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:.5 } }
  </style>
</head>

  try {
    const res = await fetch(`${SUPA_URL}/rest/v1/groups?code=eq.${code}&select=data`, {

function calcPoints(picks, standings, activeLeagues) {
  return (activeLeagues || LEAGUE_IDS).reduce((sum, lid) => {
    const pos = (standings[lid]||[]).indexOf(picks[lid]);
    return sum + (pos !== -1 ? pos+1 : 0);
  }, 0);
}

function isDraftDone(players, picks, activeLeagues) {
  return players.every(p => (activeLeagues || LEAGUE_IDS).every(lid => picks[p.id]?.[lid]));
}

function buildOrder(players, mode) {
  if (mode === "random") {
    const ids = [...players.map(p=>p.id)];
    for(let i=ids.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]];}
    const out = [];
    const al = LEAGUE_IDS;
    for(let r=0;r<al.length;r++) out.push(...(r%2===0?ids:[...ids].reverse()));
    return out;
  }
  const ids = players.map(p=>p.id);
  const out = [];
  for(let r=0;r<LEAGUE_IDS.length;r++) out.push(...(r%2===0?ids:[...ids].reverse()));
  return out;
}

// ---- ADMIN GATE ----
function AdminGate({ onUnlock }) {
  const [code, setCode] = useState("");
  const [err, setErr] = useState(false);

  function tryCode() {
    if (code === ADMIN_CODE) { onUnlock(); }
    else { setErr(true); setTimeout(()=>setErr(false), 1500); setCode(""); }
  }

  return (
    <div style={{ padding:"40px 20px", maxWidth:340, margin:"0 auto", textAlign:"center" }}>
      <div style={{ fontSize:40, marginBottom:16 }}>🔒</div>
      <h3 style={{ color:"#fff", fontWeight:900, fontSize:20, marginBottom:8 }}>Admin adgang</h3>
      <p style={{ color:C.muted, fontSize:13, marginBottom:24 }}>Indtast admin-koden for at fortsætte</p>
      <input
        type="password"
        value={code}
        onChange={e=>setCode(e.target.value)}
        onKeyDown={e=>e.key==="Enter"&&tryCode()}
        placeholder="Kode"
        style={{ width:"100%", background:"rgba(255,255,255,0.08)", border:`1px solid ${err?"#ff2d78":C.border2}`, borderRadius:40, padding:"14px 20px", fontSize:18, color:"#fff", textAlign:"center", letterSpacing:8, outline:"none", fontFamily:"inherit", marginBottom:12, transition:"border .2s" }}
      />
      {err && <p style={{ color:"#ff2d78", fontSize:13, marginBottom:12 }}>Forkert kode</p>}
      <RoundBtn onClick={tryCode} full>Bekræft</RoundBtn>
    </div>
  );
}

function StandingsTab({ league }) {
  const { players, picks, standings, activeLeagues = LEAGUE_IDS } = league;
  const scores = players.map(p=>({
    ...p, total:calcPoints(picks[p.id]||{}, standings, activeLeagues),
    byLeague:Object.fromEntries(activeLeagues.map(lid=>{
      const team=picks[p.id]?.[lid];
      const pos=(standings[lid]||[]).indexOf(team);
      return [lid,{team,points:pos!==-1?pos+1:null}];
    }))
  })).sort((a,b)=>a.total-b.total);

  const medals = ["🥇","🥈","🥉"];
  const medalColors = [C.yellow, "#C0C0C0", "#CD7F32"];

  const [expanded, setExpanded] = useState(null);

  return (
    <div style={{ padding:"12px 12px 60px" }}>
      {scores.map((p,i)=>{
        const isOpen = expanded === p.id;
        const sortedLeagues = [...activeLeagues].sort((a,b)=>{
          const pa = p.byLeague[a].points ?? 999;
          const pb = p.byLeague[b].points ?? 999;
          return pa - pb;
        });
        return (
          <div key={p.id} style={{
            background: i===0 ? `linear-gradient(135deg,rgba(235,255,0,0.08),rgba(255,255,255,0.06))` : C.card,
            border: `1px solid ${i===0?C.yellow+"44":C.border}`,
            borderRadius:14, marginBottom:8,
            animation:"fadeIn .3s ease both", animationDelay:`${i*0.05}s`,
            overflow:"hidden",

              <div style={{ fontSize:12, color:C.dim, flexShrink:0, marginLeft:2, transform: isOpen?"rotate(180deg)":"none", transition:"transform .2s" }}>▼</div>

            <div style={{ padding:"0 14px 10px", display:"flex", flexWrap:"wrap", gap:"4px 5px" }}>
              {sortedLeagues.map(lid=>{
                const {team, points} = p.byLeague[lid];

                  : points<=3 ? "rgba(0,255,135,0.15)"
                  : points<=8 ? "rgba(0,210,255,0.12)"

                const textColor = !hasPoints ? C.dim
                  : points<=3 ? C.green
                  : points<=8 ? C.teal
                  : C.muted;
                return (
                  <div key={lid} style={{
                    background: chipColor,
                    border:`1px solid ${hasPoints ? textColor+"44" : "rgba(255,255,255,0.08)"}`,
                    borderRadius:20, padding:"3px 8px",
                    display:"flex", alignItems:"center", gap:3

                    {!hasPoints && <span style={{ fontSize:10, color:C.dim }}>–</span>}
                  </div>
                );
              })}
            </div>

            {/* Udvidet detalje — holdnavne */}
            {isOpen && (
              <div style={{ borderTop:`1px solid ${C.border}`, padding:"10px 14px 12px", display:"grid", gridTemplateColumns:"1fr 1fr", gap:"5px 10px" }}>
                {sortedLeagues.map(lid=>{

                  return (

                      <span style={{ fontSize:9, fontWeight:700, color:C.dim, flexShrink:0 }}>{LEAGUES[lid].flag}</span>
                      <span style={{ fontSize:11, color: hasPoints?"#e8f4ff":C.dim, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap", flex:1 }}>{team||"–"}</span>
                      {hasPoints && <span style={{ fontSize:11, fontWeight:800, color: points<=3?C.green:points<=8?C.teal:C.muted, flexShrink:0 }}>({points})</span>}

}

// ---- TABELLER TAB ----
function TabellerTab({ league, isAdmin, onUpdate }) {
  const { players, picks, standings, activeLeagues = LEAGUE_IDS } = league;
  const [open, setOpen] = useState({});

  function toggle(lid) { setOpen(p => ({ ...p, [lid]: !p[lid] })); }

  function move(lid, team, dir) {
    const t=[...(standings[lid]||[])];
    const i=t.indexOf(team), ni=i+dir;
    if(ni<0||ni>=t.length) return;
    [t[i],t[ni]]=[t[ni],t[i]];
    onUpdate({ standings:{...standings,[lid]:t} });
  }

  return (
    <div style={{ padding:"12px 12px 60px" }}>
      {!isAdmin && (
        <div style={{ background:"rgba(255,45,120,0.08)", border:"1px solid rgba(255,45,120,0.25)", borderRadius:10, padding:"9px 14px", marginBottom:12, fontSize:12, color:"#ff2d78" }}>
          Kun admin kan flytte hold
        </div>
      )}
      {activeLeagues.map((lid,i) => {
        const l = LEAGUES[lid];
        const isOpen = !!open[lid];
        const rows = standings[lid] || [];
        return (
          <div key={lid} style={{ marginBottom:6, animation:"fadeIn .3s ease both", animationDelay:`${i*0.02}s` }}>
            {/* Clickable header */}
            <button onClick={()=>toggle(lid)} style={{
              width:"100%", display:"flex", alignItems:"center", gap:10,
              padding:"12px 14px", borderRadius: isOpen ? "10px 10px 0 0" : 10,
              background: isOpen ? "rgba(255,255,255,0.1)" : C.card,
              border:`1px solid ${isOpen ? C.border2 : C.border}`,
              borderBottom: isOpen ? "none" : undefined,
              cursor:"pointer", fontFamily:"inherit",
            }}>
              <span style={{ fontSize:18, flexShrink:0 }}>{l.flag}</span>
              <span style={{ fontWeight:800, fontSize:14, color:"#fff", flex:1, textAlign:"left" }}>{l.name}</span>
              <span style={{ fontSize:11, color:C.dim, marginRight:4 }}>{rows.length} hold</span>
              <span style={{ fontSize:12, color:C.dim, transform: isOpen?"rotate(180deg)":"none", transition:"transform .2s" }}>▼</span>
            </button>
            {/* Dropdown */}
            {isOpen && (
              <div style={{ background:"rgba(255,255,255,0.04)", border:`1px solid ${C.border2}`, borderTop:"none", borderRadius:"0 0 10px 10px", overflow:"hidden" }}>
                {rows.map((team,pos)=>{
                  const owner=players.find(p=>picks[p.id]?.[lid]===team);
                  const last=pos===rows.length-1;
                  return (
                    <div key={team} style={{ display:"flex", alignItems:"center", gap:8, padding:"6px 12px", borderBottom:last?"none":`1px solid rgba(255,255,255,0.04)` }}>
                      <div style={{ width:20, textAlign:"center", fontSize:11, color:pos<3?[C.yellow,"#C0C0C0","#CD7F32"][pos]:C.dim, fontWeight:900, flexShrink:0 }}>{pos+1}</div>
                      <div style={{ flex:1, minWidth:0 }}>
                        <span style={{ fontSize:12, fontWeight:600, color:"#fff" }}>{team}</span>
                        {owner && <span style={{ marginLeft:7, fontSize:11, color:C.teal, fontWeight:700 }}>{owner.name.split(" ")[0]}</span>}
                      </div>
                      {isAdmin && (
                        <div style={{ display:"flex", gap:3, flexShrink:0 }}>
                          {[[-1,"▲"],[1,"▼"]].map(([dir,icon])=>(
                            <button key={dir} onClick={()=>move(lid,team,dir)}
                              disabled={(dir===-1&&pos===0)||(dir===1&&last)}
                              style={{ background:"rgba(255,255,255,0.08)", border:`1px solid ${C.border}`, color:((dir===-1&&pos===0)||(dir===1&&last))?C.dim:"#fff", borderRadius:5, width:24, height:24, cursor:"pointer", fontSize:10, fontWeight:700, fontFamily:"inherit" }}>
                              {icon}
                            </button>
                          ))}
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

// ---- UDVIKLING TAB ----
function UdviklingTab({ league }) {
  const { players, picks, standings, activeLeagues = LEAGUE_IDS } = league;
  const scores = players.map(p=>({
    ...p, total:calcPoints(picks[p.id]||{}, standings, activeLeagues)
  })).sort((a,b)=>a.total-b.total);

  const history = league.history || [];

  const W = 320, H = 200, PAD = { top:16, right:16, bottom:24, left:28 };
  const innerW = W-PAD.left-PAD.right, innerH = H-PAD.top-PAD.bottom;

  function x(wi) { return PAD.left + (wi / Math.max(history.length-1,1)) * innerW; }
  function y(rank) { return PAD.top + ((rank-1) / Math.max(players.length-1,1)) * innerH; }
  function path(pid) {
    return history.map((week,wi)=>{
      const e=week.find(e=>e.id===pid);
      return `${wi===0?"M":"L"}${x(wi).toFixed(1)},${y(e?.rank||1).toFixed(1)}`;
    }).join(" ");
  }

  return (
    <div style={{ padding:"16px 16px 60px" }}>
      {history.length > 1 ? (
        <Card style={{ marginBottom:20, padding:"20px 12px 12px" }}>
          <svg viewBox={`0 0 ${W} ${H}`} style={{ width:"100%", height:"auto", overflow:"visible" }}>
            {Array.from({length:players.length},(_,i)=>(
              <line key={i} x1={PAD.left} x2={W-PAD.right} y1={y(i+1)} y2={y(i+1)} stroke="rgba(255,255,255,0.07)" strokeWidth="1"/>
            ))}
            {history.map((_,wi)=>(
              wi%2===0&&<text key={wi} x={x(wi)} y={H-4} textAnchor="middle" fontSize="9" fill="rgba(255,255,255,0.3)">U{wi+1}</text>
            ))}
            {Array.from({length:players.length},(_,i)=>(
              <text key={i} x={PAD.left-6} y={y(i+1)+3} textAnchor="end" fontSize="9" fill="rgba(255,255,255,0.3)">{i+1}</text>
            ))}
            {players.map((p,pi)=>(
              <path key={p.id} d={path(p.id)} fill="none" stroke={PLAYER_COLORS[pi%PLAYER_COLORS.length]}
                strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"
                style={{filter:`drop-shadow(0 0 4px ${PLAYER_COLORS[pi%PLAYER_COLORS.length]}88)`}}/>
            ))}
            {players.map((p,pi)=>{
              const last=history[history.length-1]?.find(e=>e.id===p.id);
              if(!last)return null;
              return <circle key={p.id} cx={x(history.length-1)} cy={y(last.rank)} r="4"
                fill={PLAYER_COLORS[pi%PLAYER_COLORS.length]} stroke="#00003c" strokeWidth="2"/>;
            })}
          </svg>
        </Card>
      ) : (
        <Card style={{ marginBottom:20, textAlign:"center", padding:32 }}>
          <p style={{ color:C.muted, fontSize:13 }}>Historik vises her, efterhanden som saesonen skrider frem.</p>
        </Card>
      )}

      {scores.map((p,i)=>{
        const color = PLAYER_COLORS[players.findIndex(pl=>pl.id===p.id) % PLAYER_COLORS.length];
        const lastWeek = history[history.length-1]?.find(e=>e.id===p.id);
        const prevWeek = history[history.length-2]?.find(e=>e.id===p.id);
        const trend = prevWeek && lastWeek ? prevWeek.rank - lastWeek.rank : 0;
        return (
          <div key={p.id} style={{ display:"flex", alignItems:"center", gap:12, padding:"12px 16px", background:C.card, border:`1px solid ${C.border}`, borderRadius:12, marginBottom:8, animation:"fadeIn .3s ease both", animationDelay:`${i*0.04}s` }}>
            <div style={{ width:12, height:12, borderRadius:"50%", background:color, flexShrink:0, boxShadow:`0 0 8px ${color}88` }}/>
            <div style={{ flex:1, fontWeight:700, fontSize:15, color:"#fff" }}>{p.name}</div>
            {trend!==0 && <div style={{ fontSize:12, fontWeight:700, color:trend>0?C.green:"#ff2d78" }}>{trend>0?`+${trend}`:trend}</div>}
            <div style={{ textAlign:"right" }}>
              <div style={{ fontSize:22, fontWeight:900, color:i===0?C.yellow:"#fff", letterSpacing:-1 }}>{i+1}</div>
              <div style={{ fontSize:10, color:C.dim, letterSpacing:1 }}>PLADS</div>
            </div>
          </div>
        );
      })}
    </div>
  );
}

// ---- ADMIN TAB ----
function AdminTab({ league, onUpdate }) {
  const [adminPlayer, setAdminPlayer] = useState(null);
  const [adminLeague, setAdminLeague] = useState(null);
  const [updating, setUpdating] = useState(false);
  const [updateMsg, setUpdateMsg] = useState("");
  const { players, picks, standings, activeLeagues = LEAGUE_IDS } = league;

  // ESPN slug-based league IDs
  const ESPN_SLUGS = {
    PL:  "eng.1",
    LL:  "esp.1",
    BL:  "ger.1",
    SA:  "ita.1",
    L1:  "fra.1",
    NL:  "ned.1",
    TR:  "tur.1",
    DK:  "den.1",
    SC:  "sco.1",
    PT:  "por.1",
    CH:  "eng.2",
    BE:  "bel.1",
    AT:  "aut.1",
    EK:  "pol.1",
    DK1: "den.2",
  };

  async function fetchESPNStandings(slug) {
    // Kald vores egen Vercel serverless function — ingen CORS problemer
    try {
      const res = await fetch(`/api/standings?slug=${slug}`);
      if (res.ok) {
        const data = await res.json();
        if (data.teams && data.teams.length > 0) return data.teams;
      }
    } catch(e) {}
    return null;
  }

  async function updateStandings() {
    setUpdating(true);
    setUpdateMsg("Henter stillinger...");
    try {
      const al = activeLeagues;
      let updated = 0;
      let failed = [];
      const newStandings = { ...standings };

      for (const lid of al) {
        const slug = ESPN_SLUGS[lid];
        if (!slug) continue;
        setUpdateMsg(`Henter ${LEAGUES[lid].name}...`);
        const teams = await fetchESPNStandings(slug);
        if (teams && teams.length > 0) {
          newStandings[lid] = teams;
          updated++;
        } else if (newStandings[lid] && newStandings[lid].length > 0) {
          // Keep existing standings if fetch fails
          updated++;
        } else {
          failed.push(lid);
        }
        await new Promise(r => setTimeout(r, 300));
      }

      const updatedLeague = { ...league, standings: newStandings };
      onUpdate(updatedLeague);
      await saveGroup(GROUP_CODE, updatedLeague);
      setUpdateMsg(failed.length > 0
        ? `Opdateret: ${updated}/${al.length}. Fejlede: ${failed.map(lid => LEAGUES[lid]?.name || lid).join(", ")}`
        : `Opdateret! (${updated}/${al.length} ligaer) ✓`
      );
    } catch(e) {
      setUpdateMsg("Fejl - prøv igen");
    }
    setUpdating(false);
    setTimeout(()=>setUpdateMsg(""), 8000);
  }

  return (
    <div style={{ padding:"16px 16px 60px", display:"flex", flexDirection:"column", gap:16 }}>

      {/* Opdater stillinger */}
      <Card>
        <div style={{ fontSize:10, letterSpacing:3, color:C.dim, fontWeight:800, textTransform:"uppercase", marginBottom:10 }}>Opdater stillinger</div>
        <div style={{ fontSize:13, color:C.muted, marginBottom:12 }}>Henter automatisk stillinger fra ESPN for alle ligaer.</div>
        <RoundBtn onClick={updateStandings} disabled={updating} style={{ padding:"12px 20px", fontSize:13 }}>
          {updating ? "Henter..." : "Opdater stillinger"}
        </RoundBtn>
        {updateMsg && <div style={{ marginTop:10, fontSize:13, color:C.teal, fontWeight:700 }}>{updateMsg}</div>}
      </Card>

      {/* Tur-styring */}
      <Card>
        <div style={{ fontSize:10, letterSpacing:3, color:C.dim, fontWeight:800, textTransform:"uppercase", marginBottom:10 }}>Tur-styring</div>
        <div style={{ fontSize:13, color:C.muted, marginBottom:12 }}>
          draftIdx: <span style={{ color:C.teal, fontWeight:800 }}>{league.draftIdx}</span>
          {" — "}Nu vælger: <span style={{ color:C.green, fontWeight:800 }}>{players.find(p=>p.id===league.draftOrder?.[league.draftIdx])?.name || "?"}</span>
        </div>
        <div style={{ display:"flex", flexWrap:"wrap", gap:8 }}>
          {players.map(p => {
            const picksCount = Object.keys(picks[p.id]||{}).length;
            const positions = (league.draftOrder||[]).map((id,i)=>({id,i})).filter(x=>x.id===p.id).map(x=>x.i);
            const nextPos = positions[picksCount] ?? -1;
            return (
              <button key={p.id} onClick={async()=>{
                if(!window.confirm("Giv turen til " + p.name + "?")) return;
                const updated = { ...league, draftIdx:nextPos };
                onUpdate(updated);
                await saveGroup(GROUP_CODE, updated);
              }} style={{ padding:"8px 14px", borderRadius:40, background:"rgba(255,255,255,0.08)", border:`1px solid ${C.border2}`, color:"#fff", cursor:"pointer", fontSize:12, fontWeight:700, fontFamily:"inherit" }}>
                {p.name} <span style={{ color:C.dim, fontSize:10 }}>({picksCount} valgt)</span>
              </button>
            );
          })}
        </div>
      </Card>

      {/* Vælg hold for spiller */}
      <Card>
        <div style={{ fontSize:10, letterSpacing:3, color:C.dim, fontWeight:800, textTransform:"uppercase", marginBottom:10 }}>Vælg hold for spiller</div>
        <div style={{ display:"flex", flexWrap:"wrap", gap:8, marginBottom:12 }}>
          {players.map(p=>(
            <button key={p.id} onClick={()=>{setAdminPlayer(p);setAdminLeague(null);}} style={{ padding:"8px 14px", borderRadius:40, background:adminPlayer?.id===p.id?"#ff2d78":"rgba(255,255,255,0.08)", border:`1px solid ${adminPlayer?.id===p.id?"#ff2d78":C.border2}`, color:"#fff", cursor:"pointer", fontSize:12, fontWeight:700, fontFamily:"inherit" }}>
              {p.name}
            </button>
          ))}
        </div>
        {adminPlayer && (
          <div>
            <div style={{ fontSize:11, color:C.dim, marginBottom:8, textTransform:"uppercase", letterSpacing:1 }}>Liga</div>
            <div style={{ display:"flex", flexWrap:"wrap", gap:6, marginBottom:12 }}>
              {activeLeagues.map(lid=>{
                const l=LEAGUES[lid];
                const already=picks[adminPlayer.id]?.[lid];
                return (
                  <button key={lid} onClick={()=>setAdminLeague(lid)} style={{ padding:"6px 10px", borderRadius:40, background:adminLeague===lid?l.accent:already?"rgba(0,255,135,0.1)":"rgba(255,255,255,0.08)", border:`1px solid ${adminLeague===lid?l.accent:already?"#00ff8744":C.border2}`, color:adminLeague===lid?"#000":already?C.green:"#fff", cursor:"pointer", fontSize:11, fontWeight:700, fontFamily:"inherit" }}>
                    {l.flag} {lid} {already?`(${already})`:""}
                  </button>
                );
              })}
            </div>
          </div>
        )}
        {adminPlayer && adminLeague && (
          <div>
            <div style={{ fontSize:11, color:C.dim, marginBottom:8, textTransform:"uppercase", letterSpacing:1 }}>Hold i {LEAGUES[adminLeague]?.name}</div>
            <div style={{ display:"flex", flexDirection:"column", gap:4, maxHeight:280, overflowY:"auto" }}>
              {(TEAMS[adminLeague]||[]).map(team=>{
                const takenBy=players.find(p=>picks[p.id]?.[adminLeague]===team);
                const isOwn=takenBy?.id===adminPlayer.id;
                const l=LEAGUES[adminLeague];
                return (
                  <button key={team} onClick={async()=>{
                    if(takenBy&&!isOwn){alert(team+" er allerede valgt af "+takenBy.name);return;}
                    if(!window.confirm("Vælg "+team+" for "+adminPlayer.name+"?")) return;
                    const np={...picks,[adminPlayer.id]:{...(picks[adminPlayer.id]||{}),[adminLeague]:team}};
                    const updated={...league,picks:np};
                    onUpdate(updated);
                    await saveGroup(GROUP_CODE,updated);
                    setAdminLeague(null);
                  }} style={{ padding:"8px 14px", borderRadius:8, textAlign:"left", background:isOwn?"rgba(0,255,135,0.1)":takenBy?"rgba(255,255,255,0.03)":"rgba(255,255,255,0.08)", border:`1px solid ${isOwn?"#00ff8744":takenBy?"rgba(255,255,255,0.05)":l.accent+"44"}`, color:isOwn?C.green:takenBy?C.dim:l.accent, cursor:takenBy&&!isOwn?"not-allowed":"pointer", fontSize:12, fontWeight:700, fontFamily:"inherit" }}>
                    {team}{takenBy&&!isOwn?` — ${takenBy.name}`:""}
                  </button>
                );
              })}
            </div>
          </div>
        )}
      </Card>

      {/* Slet et valg */}
      <Card>
        <div style={{ fontSize:10, letterSpacing:3, color:C.dim, fontWeight:800, textTransform:"uppercase", marginBottom:10 }}>Slet et valg</div>
        {players.map(p=>{
          const pp=picks[p.id]||{};
          const lids=Object.keys(pp);
          if(!lids.length) return null;
          return (
            <div key={p.id} style={{ marginBottom:12, paddingBottom:12, borderBottom:`1px solid ${C.border}` }}>
              <div style={{ fontWeight:800, fontSize:13, color:C.teal, marginBottom:8 }}>{p.name}</div>
              <div style={{ display:"flex", flexWrap:"wrap", gap:6 }}>
                {lids.map(lid=>(
                  <button key={lid} onClick={async()=>{
                    if(!window.confirm("Slet "+p.name+"s valg: "+pp[lid]+"?")) return;
                    const np={...pp};delete np[lid];
                    const updated={...league,picks:{...picks,[p.id]:np}};
                    onUpdate(updated);
                    await saveGroup(GROUP_CODE,updated);
                  }} style={{ padding:"5px 10px", borderRadius:40, background:"rgba(255,45,120,0.12)", border:"1px solid rgba(255,45,120,0.4)", color:"#ff2d78", cursor:"pointer", fontSize:11, fontWeight:700, fontFamily:"inherit" }}>
                    {LEAGUES[lid]?.flag} {pp[lid]} ×
                  </button>
                ))}
              </div>
            </div>
          );
        })}
      </Card>

    </div>
  );
}

// ---- HERO ----
function LeagueHero({ league }) {
  const { players, picks, standings, activeLeagues = LEAGUE_IDS } = league;
  const scores = players.map(p=>({
    ...p, total:calcPoints(picks[p.id]||{}, standings, activeLeagues)
  })).sort((a,b)=>a.total-b.total);

  const leader = scores[0];
  const totalPicks = players.reduce((s,p)=>s+Object.keys(picks[p.id]||{}).length,0);
  const totalPossible = players.length * activeLeagues.length;

  return (
    <div style={{ background: "rgba(20,40,100,0.45)", backdropFilter:"blur(12px)", WebkitBackdropFilter:"blur(12px)", padding:"20px 16px 16px", position:"relative", overflow:"hidden" }}>
      <div style={{ position:"absolute", inset:0, background:"radial-gradient(ellipse at 50% 0%,rgba(0,210,255,0.2) 0%,transparent 70%)", pointerEvents:"none" }}/>
      <div style={{ position:"relative" }}>
        {/* Title + leader on same row */}
        <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:12 }}>
          <div>
            <h1 style={{ fontSize:26, fontWeight:900, letterSpacing:-1, color:"#fff", margin:0, lineHeight:1 }}>
              LIGA<span style={{ color:C.yellow }}>MANAGER</span>
            </h1>
            <p style={{ fontSize:10, color:"rgba(255,255,255,0.5)", letterSpacing:1.5, textTransform:"uppercase", margin:"3px 0 0" }}>{league.name}</p>
          </div>
          {leader && (
            <div style={{ textAlign:"right" }}>
              <div style={{ fontSize:11, color:"rgba(255,255,255,0.5)", textTransform:"uppercase", letterSpacing:1 }}>Forer</div>
              <div style={{ fontSize:14, fontWeight:900, color:"#fff" }}>🥇 {leader.name.split(" ")[0]}</div>
              <div style={{ fontSize:20, fontWeight:900, color:C.yellow, lineHeight:1 }}>{leader.total} pt.</div>
            </div>
          )}
        </div>
        {/* Stats row */}
        <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:8 }}>
          {[
            { val: leader?.total ?? "—", label:"Ledende", color:C.yellow },
            { val: players.length, label:"Spillere", color:"#fff" },
            { val: activeLeagues.length, label:"Ligaer", color:C.teal },
          ].map(({val,label,color})=>(
            <div key={label} style={{ background:"rgba(0,0,0,0.2)", borderRadius:10, padding:"10px 8px", textAlign:"center" }}>
              <div style={{ fontSize:22, fontWeight:900, color, lineHeight:1 }}>{val}</div>
              <div style={{ fontSize:9, color:"rgba(255,255,255,0.45)", letterSpacing:1, textTransform:"uppercase", marginTop:2 }}>{label}</div>
            </div>
          ))}
        </div>
        {league.phase === "draft" && (
          <div style={{ marginTop:10 }}>
            <div style={{ display:"flex", justifyContent:"space-between", marginBottom:4 }}>
              <span style={{ fontSize:10, color:"rgba(255,255,255,0.4)" }}>Draft fremgang</span>
              <span style={{ fontSize:10, color:"rgba(255,255,255,0.4)" }}>{totalPicks}/{totalPossible}</span>
            </div>
            <div style={{ height:3, background:"rgba(255,255,255,0.12)", borderRadius:2 }}>
              <div style={{ height:"100%", width:`${(totalPicks/totalPossible)*100}%`, background:"linear-gradient(90deg,#00d2ff,#00ff87)", borderRadius:2, transition:"width .4s" }}/>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

// ---- MAIN APP ----
function App() {
  const [league, setLeague] = useState(null);
  const [loading, setLoading] = useState(true);
  const [tab, setTab] = useState("rangliste");
  const [adminUnlocked, setAdminUnlocked] = useState(false);
  const [adminGate, setAdminGate] = useState(false);

  useEffect(()=>{
    loadGroup(GROUP_CODE).then(g=>{
      if(g) setLeague({ ...g, code: GROUP_CODE });
      setLoading(false);
    });
  },[]);

  // Poll every 10s
  useEffect(()=>{
    const iv = setInterval(async()=>{
      const g = await loadGroup(GROUP_CODE);
      if(g) setLeague(prev => ({ ...g, code: GROUP_CODE }));
    }, 10000);
    return ()=>clearInterval(iv);
  },[]);

  async function handleUpdate(patch) {
    const updated = { ...league, ...patch };
    setLeague(updated);
    await saveGroup(GROUP_CODE, updated);
  }

  const TABS = [
    { id:"rangliste", label:"Rangliste" },
    { id:"spillere",  label:"Spillere" },
    { id:"ligaer",    label:"Ligaer" },
    { id:"tabeller",  label:"Tabeller" },
    { id:"udvikling", label:"Udvikling" },
    { id:"admin",     label:"Admin" },
  ];

  if (loading) return (
    <div style={{ minHeight:"100vh", background:"rgba(20,40,100,0.35)", backdropFilter:"blur(8px)", WebkitBackdropFilter:"blur(8px)", display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", gap:16 }}>
      <div style={{ fontSize:32, fontWeight:900, letterSpacing:-1, color:"#fff" }}>LIGA<span style={{ color:C.teal }}>MANAGER</span></div>
      <Spinner/>
    </div>
  );

  if (!league) return (
    <div style={{ minHeight:"100vh", background:"rgba(20,40,100,0.35)", backdropFilter:"blur(8px)", WebkitBackdropFilter:"blur(8px)", display:"flex", alignItems:"center", justifyContent:"center", padding:20 }}>
      <div style={{ textAlign:"center", maxWidth:340 }}>
        <div style={{ fontSize:48, marginBottom:16 }}>⚠️</div>
        <h2 style={{ color:"#fff", fontWeight:900, fontSize:20, marginBottom:8 }}>Kunne ikke hente gruppe</h2>
        <p style={{ color:C.muted, fontSize:14, marginBottom:8 }}>Tjek din internetforbindelse og prøv igen.</p>
        <p style={{ color:"rgba(255,255,255,0.3)", fontSize:11, marginBottom:20 }}>Gruppe: {GROUP_CODE}</p>
        <RoundBtn onClick={()=>window.location.reload()} style={{ marginTop:4 }}>Prøv igen</RoundBtn>
        <div style={{ marginTop:20 }}>
          <button onClick={async()=>{
            let msg = "";
            const tests = [
              { label:"rpc/get_group", url:`${SUPA_URL}/rest/v1/rpc/get_group`, method:"POST", body:JSON.stringify({p_code:GROUP_CODE}) },
              { label:"rpc/upsert_group", url:`${SUPA_URL}/rest/v1/rpc/upsert_group`, method:"POST", body:JSON.stringify({p_code:"TEST",p_data:{}}) },
              { label:"groups GET", url:`${SUPA_URL}/rest/v1/groups?code=eq.${GROUP_CODE}&select=data`, method:"GET", body:null },
            ];
            for(const t of tests){
              try{
                const r = await fetch(t.url,{method:t.method,headers:{"apikey":SUPA_KEY,"Authorization":`Bearer ${SUPA_KEY}`,"Content-Type":"application/json"},body:t.body||undefined});
                const txt = await r.text();
                msg += `\n${t.label}: ${r.status} → ${txt.slice(0,100)}`;
              }catch(e){msg+=`\n${t.label}: NETVÆRKSFEJL`;}
            }
            alert(msg);
          }} style={{ background:"rgba(255,255,255,0.08)", border:"1px solid rgba(255,255,255,0.2)", color:"rgba(255,255,255,0.5)", borderRadius:40, padding:"8px 16px", fontSize:11, cursor:"pointer", fontFamily:"inherit" }}>
            Debug
          </button>
        </div>
      </div>
    </div>
  );

  return (
    <div style={{ minHeight:"100vh", background:"transparent", color:"#e8f4ff", fontFamily:"'Rajdhani','Arial Narrow',sans-serif" }}>

      {/* Hero */}
      <LeagueHero league={league}/>

      {/* Tab bar */}
      <TabBar tabs={TABS} active={tab} onChange={t=>{
        if(t==="admin" && !adminUnlocked){
          setAdminGate(true);
          setTab("admin");
        } else {
          setTab(t);
        }
      }}/>

      {/* Content */}
      {tab==="rangliste"  && <StandingsTab league={league}/>}
      {tab==="spillere"   && <SpillereTab league={league}/>}
      {tab==="ligaer"     && <LigaerTab league={league}/>}
      {tab==="tabeller"   && <TabellerTab league={league} isAdmin={adminUnlocked} onUpdate={handleUpdate}/>}
      {tab==="udvikling"  && <UdviklingTab league={league}/>}
      {tab==="admin" && (
        adminUnlocked
          ? <AdminTab league={league} onUpdate={handleUpdate}/>
          : adminGate
            ? <AdminGate onUnlock={()=>{ setAdminUnlocked(true); setAdminGate(false); }}/>
            : null
      )}
    </div>
  );
}

if (typeof document !== "undefined") {
  const _mount = () => {
    const el = document.getElementById("root");
    if (el && typeof ReactDOM !== "undefined") {
      ReactDOM.createRoot(el).render(React.createElement(App));
    }
  };
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", _mount);
  } else {
    _mount();
  }
}
  </script>
</body>
</html>
